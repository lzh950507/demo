[project]
name = "fastdemo"
version = "0.1.0"
description = "壹思唯项目"
requires-python = ">=3.12"
dependencies = [
    "dynaconf[all]>=3.2.12",
    "fastapi>=0.128.0",
    "faster-whisper>=1.2.1",
    "loguru>=0.7.3",
    "python-multipart>=0.0.21",
    "uvicorn>=0.40.0",
]
[tool.uv]
link-mode = "copy"

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ysw_core", "src/ysw_ai", "src/ysw_web"]
